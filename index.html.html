<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Градієнти</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            margin: 20px;
            float: left;
        }
    </style>
</head>
<body>
    <p style="font-size: 1in; background: linear-gradient(to left,orange,red,yellow,blue,lime,purple,indigo); color: white; text-align: center;">Ми вивчаємо градієнти</p>
    <div style="background:  linear-gradient(yellow,blue);"></div>
    <div style="background:  linear-gradient(45deg,yellow,blue);"></div>
    <div style="background:  linear-gradient(245deg,yellow,blue);"></div>
    <div style="background:  linear-gradient(245deg,yellow 20%,blue 80%);"></div>
    <div style="background:  linear-gradient(245deg,yellow 50%,blue 50%);"></div>
    <div style="background:  linear-gradient(blue 50%,yellow 50%); width: 500px;"></div>
    <div style="background:  linear-gradient(blue 50%,yellow 50%); width: 500px;"></div>
    <div style="background:  linear-gradient(red 25%,darkblue 25% 50%,yellow 50% 75%,green 75% 90%); width: 500px;"></div>
    <div style="background:  radial-gradient(yellow,blue); border-radius: 25%;"></div>
    <div style="background:  radial-gradient(circle at 25% 25%,yellow 25%,blue);"></div>
    <div style="background:  radial-gradient(circle at 75% 75%,yellow 25%,blue);"></div>
    <div style="background:  radial-gradient(circle at 50% 100%,yellow 20%,blue);"></div>
    <div style="background:  radial-gradient(yellow 20%,blue 80%); border-radius: 50%;"></div>
    <div style="background:  conic-gradient(yellow,blue); border-radius: 25%;"></div>
    <div style="background:  conic-gradient(yellow,blue,orange,green); border-radius: 25%;"></div>
    <div style="background:  conic-gradient(at 25% 25%,yellow,blue,orange,green); border-radius: 25%;"></div>
    <div style="background:  conic-gradient(yellow 25%,blue 25% 50%,orange 50% 75%,green 75%);"></div>
    <div style="background:  repeating-linear-gradient(yellow 10%,blue 20%);"></div>
    <div style="background:  repeating-linear-gradient(yellow 5% 10%,blue 10% 15%);"></div>
    <div style="background:  repeating-radial-gradient(yellow 5% 10%,blue 10% 15%);"></div>
    <div style="background:  repeating-conic-gradient(yellow 5% 10%,blue 10% 15%,orange 15% 20%,green 20% 25%);"></div>
<div style="background-image: repeating-conic-gradient(red 0deg 10deg, yellow 10deg 20deg, blue 20deg 30deg);
  border-radius: 50%;"></div>
<div style="background:
    repeating-linear-gradient(
      190deg,
      rgb(255 0 0 / 50%) 40px,
      rgb(255 153 0 / 50%) 80px,
      rgb(255 255 0 / 50%) 120px,
      rgb(0 255 0 / 50%) 160px,
      rgb(0 0 255 / 50%) 200px,
      rgb(75 0 130 / 50%) 240px,
      rgb(238 130 238 / 50%) 280px,
      rgb(255 0 0 / 50%) 300px
    ),
    repeating-linear-gradient(
      -190deg,
      rgb(255 0 0 / 50%) 30px,
      rgb(255 153 0 / 50%) 60px,
      rgb(255 255 0 / 50%) 90px,
      rgb(0 255 0 / 50%) 120px,
      rgb(0 0 255 / 50%) 150px,
      rgb(75 0 130 / 50%) 180px,
      rgb(238 130 238 / 50%) 210px,
      rgb(255 0 0 / 50%) 230px
    ),
    repeating-linear-gradient(
      23deg,
      red 50px,
      orange 100px,
      yellow 150px,
      green 200px,
      blue 250px,
      indigo 300px,
      violet 350px,
      red 370px
    );"></div>
    <div style="background:
    radial-gradient(circle at 50% 0, rgb(255 0 0 / 50%), transparent 70.71%),
    radial-gradient(circle at 6.7% 75%, rgb(0 0 255 / 50%), transparent 70.71%),
    radial-gradient(circle at 93.3% 75%, rgb(0 255 0 / 50%), transparent 70.71%)
      beige;
  border-radius: 50%;"></div>
  <div style="background:
    linear-gradient(217deg, rgb(255 0 0 / 80%), transparent 70.71%),
    linear-gradient(127deg, rgb(0 255 0 / 80%), transparent 70.71%),
    linear-gradient(336deg, rgb(0 0 255 / 80%), transparent 70.71%);"></div>
    <div style="background:
    repeating-conic-gradient(
      from 0deg at 80% 50%,
      #5691f580 0% 8.25%,
      #b338ff80 8.25% 16.5%,
      #f8305880 16.5% 25%
    ),
    repeating-conic-gradient(
      from 15deg at 50% 50%,
      #e856f580 0% 8.25%,
      #ff384c80 8.25% 16.5%,
      #e7f83080 16.5% 25%
    ),
    repeating-conic-gradient(
      from 0deg at 20% 50%,
      #f58356ff 0% 8.25%,
      #caff38ff 8.25% 16.5%,
      #30f88aff 16.5% 25%
    );"></div>
        <div style="background:  radial-gradient(circle at 50% 50%,red 15% 30%,rgb(232, 225, 225) 45% 60%); width: 500px; "></div>
        
      <div style="background: conic-gradient(
      white 0.25turn,
      black 0.25turn 0.5turn,
      white 0.5turn 0.75turn,
      black 0.75turn
    )
    top left / 25% 25% repeat;
  border: 1px solid;"></div>
</body>
</html>
